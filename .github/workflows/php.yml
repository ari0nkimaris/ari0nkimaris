
name: Repository Validation

'on':
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate profile repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check profile README
        run: |
          test -f README.md
          test -s README.md
          echo "Profile README exists and is not empty."

      - name: Check workflow files
        run: |
          test -d .github/workflows
          echo "Workflow directory exists."
