
name: Python application

'on':
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python files
        run: |
          python -c "import pathlib; files = list(pathlib.Path('.').rglob('*.py')); print(f'Found {len(files)} Python file(s).'); print('\n'.join(str(f) for f in files))"

      - name: Check profile README
        run: |
          test -f README.md
          test -s README.md
          echo "README.md exists and is not empty."
